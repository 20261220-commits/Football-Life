<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이번 생은 축구다</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 고정 헤더(홈·단계·이름·OVR) + 탭(시즌/커리어/선수/우승 연혁), 560px 단일 컬럼. 결과 화면은 타일·접이식 상세·공개 애니메이션, 선택은 모달 */
:root{color-scheme:dark;
--bg:#070a0b;--card:#0e1416;--card2:#131b1d;--ink:#e6eeeb;--mute:#8b9a96;--line:#1f2a2c;--on:#04170f;
--g:#2bcf8e;--cy:#5fa8b4;--vi:#8f88bf;--or:#c99561;--pk:#b98a9e;--yel:#d8b75a;--red:#e06a7c;--blue:#7d9cc4;
--fd:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
--fb:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55;
background-image:radial-gradient(700px 420px at 50% -10%,rgba(43,207,142,.06),transparent 70%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{border:1px solid var(--line);border-radius:18px;padding:26px 20px;text-align:center;margin-bottom:14px;background:linear-gradient(170deg,rgba(43,207,142,.07),var(--card) 70%)}
h1{font-family:var(--fd);font-weight:400;font-size:38px;margin:0;line-height:1.1;color:var(--g);text-wrap:balance}
.hero p{margin:8px 0 0;color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px;text-wrap:balance}
h2.k{display:flex;align-items:center;gap:8px}h2.k::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--g));}
.lb{display:block;font-size:13px;color:var(--mute);margin:0 0 12px}
.lb input,.lb select{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--ink);font-family:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:grid;gap:8px}.btns.two{grid-template-columns:1fr 1fr}
button{font:inherit;font-weight:700;padding:13px 12px;border-radius:10px;border:1px solid var(--g);background:var(--g);color:var(--on);cursor:pointer;text-align:center;touch-action:manipulation}
button.alt{background:transparent;color:var(--ink);border-color:var(--line)}
button.alt.sel{border-color:var(--g);color:var(--g)}
button.vi{background:transparent;border-color:var(--vi);color:var(--vi)}
button.or{background:transparent;border-color:var(--or);color:var(--or)}
button.cy{background:transparent;border-color:var(--cy);color:var(--cy)}
button.rd{background:transparent;border-color:rgba(255,90,118,.6);color:var(--red)}
button.rdf{background:var(--red);border-color:var(--red);color:#2a0009}
button small{display:block;font-weight:400;opacity:.85;font-size:12px}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.w{width:100%}.mt{margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mute{color:var(--mute);font-size:13px}
.ovr{font-family:var(--fd);font-size:36px;line-height:1;color:var(--g);}
.ovr small{display:block;font-family:var(--fb);font-size:10px;letter-spacing:.12em;color:var(--mute);text-align:right;}
.st{display:grid;grid-template-columns:76px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.st b{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:4px;transition:width .3s}
.c0,.c1,.c2,.c3,.c4{--c:var(--g)}
.st .bar i{background:var(--c);}
.up{color:var(--g)}.dn{color:var(--red)}
.tot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:12px}
.tot div{background:var(--bg);border-radius:8px;padding:7px 2px;font-size:12px;color:var(--mute)}
.tot b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.tot div:nth-child(1) b{color:var(--ink)}.tot div:nth-child(2) b{color:var(--g)}
.log{font-size:13px}.log p{margin:0;padding:7px 0;border-bottom:1px solid var(--line)}.log p:last-child{border:0}
.tag{display:inline-block;padding:1px 8px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.04em;background:rgba(216,183,90,.14);color:var(--yel);margin-right:4px;vertical-align:1px}
.tag.r{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}.tag.g{background:color-mix(in srgb,var(--g) 16%,transparent);color:var(--g)}.tag.c{background:color-mix(in srgb,var(--cy) 16%,transparent);color:var(--cy)}.tag.v{background:color-mix(in srgb,var(--vi) 16%,transparent);color:var(--vi)}.tag.o{background:color-mix(in srgb,var(--or) 16%,transparent);color:var(--or)}.tag.p{background:color-mix(in srgb,var(--pk) 16%,transparent);color:var(--pk)}.tag.b{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.res{text-align:center}.big{font-family:var(--fd);font-size:30px;margin:6px 0;line-height:1.2}
.cands{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 4px;background:var(--card2);color:var(--ink);border:1px solid var(--line);font-weight:400}
.cd b{font-size:15px}.cd small{font-size:12px;font-weight:700;color:var(--mute)}
.cd.on{border-color:var(--cy);}.cd.on small{color:var(--cy)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv div{background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:6px;min-width:0}
.kv b{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:4px;margin-top:10px}.chips span{flex:1;text-align:center;padding:6px 0;border-radius:6px;background:var(--bg);color:var(--mute);font-size:10px;font-weight:700}
.chips .on{background:var(--g);color:var(--on)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.t0{color:var(--blue)}.t1{color:var(--or)}.t2{color:var(--cy)}.t3{color:var(--vi)}
.pop{border-color:rgba(216,183,90,.45)}
.vcard,.ocard,.ccard{border-color:var(--line)}
.tb,.gg,.tg{position:relative;height:40px;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:12px 0}
.tb i,.gg i,.tg i{position:absolute;top:0;bottom:0}
.tb .bz{background:rgba(11,241,158,.3)}.gz{background:var(--yel)}.tb .mk{width:4px;background:#fff;left:0;}
.gg .fill{left:0;width:0;background:var(--g);opacity:.7}
.tg i{left:0;width:50%;background:var(--g);opacity:.8}.tg::after{content:"";position:absolute;left:calc(100% - 3px);top:0;bottom:0;width:3px;background:var(--yel)}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;padding:10px;border:3px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0}
.mg b{aspect-ratio:1.3;max-width:100%;border-radius:8px;background:var(--card2);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px}
.mg b.on{background:var(--yel);color:#141000}.mg b.hit{background:var(--g)}
.rdb{position:relative;width:100%;max-width:300px;aspect-ratio:1;margin:10px auto;border-radius:50%;background:rgba(43,207,142,.05);border:1px dashed rgba(43,207,142,.3)}
.rdb>*{position:absolute;transform:translate(-50%,-50%)}
.rp{width:46px;height:46px;border-radius:50%;padding:0;font-size:17px;background:var(--cy);border-color:var(--cy);color:#001a1f}
.rp.mk{background:var(--card2);color:var(--mute);border-color:var(--red);}
.me{width:50px;height:50px;border-radius:50%;background:var(--g);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:700;}
.df{width:30px;height:30px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.rh{position:relative;height:230px;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:12px 0;display:grid;grid-template-columns:repeat(4,1fr)}
.rh .ln{border-right:1px solid var(--line)}.rh .ln:last-of-type{border:0}
.rh .hl{position:absolute;left:0;right:0;top:85%;height:3px;background:var(--yel);}
.nt{position:absolute;width:25%;text-align:center;font-style:normal;font-size:24px;font-weight:700;transform:translateY(-50%);display:none}
.nt.l0{left:0;color:var(--g)}.nt.l1{left:25%;color:var(--cy)}.nt.l2{left:50%;color:var(--vi)}.nt.l3{left:75%;color:var(--pk)}.nt.miss{opacity:.25}
.arw{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.arw button{font-size:20px;padding:12px 0}
.fb{min-height:24px;text-align:center;font-weight:700;margin-top:8px}
canvas{width:100%;max-width:100%;aspect-ratio:600/260;background:#f8fbff;border-radius:10px;touch-action:none;display:block}
.tbl{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
th{color:var(--mute);font-weight:600;text-align:right;padding:6px 5px;border-bottom:1px solid var(--line);font-size:11.5px;letter-spacing:.03em}
td{text-align:right;padding:7px 5px;border-bottom:1px solid var(--line)}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
td.cl{max-width:130px;overflow:hidden;text-overflow:ellipsis}
tr.bio td{color:var(--mute)}
.trophy{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.trophy:last-child{border:0}
.trophy b{font-variant-numeric:tabular-nums}
.empty{color:var(--mute);font-size:13px;margin:0}
.clubs{display:flex;flex-wrap:wrap;gap:6px}
#toast{box-shadow:0 8px 24px rgba(0,0,0,.5);position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:20;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 20px;text-align:center;min-width:220px;max-width:calc(100% - 32px)}
#toast b{display:block;font-family:var(--fd);font-weight:400;font-size:22px}#toast span{display:block;font-size:13px;color:var(--mute)}
#toast.in{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.live{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.live div{background:var(--bg);border-radius:8px;padding:8px 2px;font-size:11px;color:var(--mute);text-align:center}
.live b{display:block;font-family:var(--fd);font-weight:400;font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}

#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#0c1214;border-bottom:1px solid var(--line)}
.hin{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hb{display:flex;align-items:center;gap:10px;padding-block:10px}
.ic{width:36px;height:36px;padding:0;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--ink);font-size:18px;flex:none}
.badge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--card2);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.hn{min-width:0;flex:1;display:flex;align-items:baseline;gap:6px;overflow:hidden}.hn b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hn span{font-size:12px;color:var(--mute);white-space:nowrap}
.ho{display:flex;align-items:baseline;gap:4px}.ho small{font-size:10px;color:var(--mute);letter-spacing:.08em}.ho b{font-size:22px;font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mute);font-weight:600;font-size:14px;padding:10px 0}
.tabs button.on{color:var(--ink);border-bottom-color:var(--g)}
.eye{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--g);margin:0 0 4px}
.pt{font-size:24px;margin:0 0 6px}
.card h3,.sheet h3{font-size:14px;margin:0 0 8px}
button.sm{padding:8px 12px;font-size:13px}
.news{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.seg{display:grid;gap:6px;margin-bottom:14px}.seg.s3{grid-template-columns:repeat(3,1fr)}.seg.s4{grid-template-columns:repeat(4,1fr)}
.seg button{background:var(--card2);border:1px solid var(--line);color:var(--ink);font-weight:600;padding:10px 2px;font-size:13px}.seg button small{font-size:10px;color:var(--mute)}
.seg button.on{background:color-mix(in srgb,var(--g) 18%,var(--card2));border-color:var(--g)}
.row2{display:grid;grid-template-columns:1fr 96px;gap:10px}
.inp{position:relative;display:block}.inp em{position:absolute;right:12px;top:calc(50% + 2px);transform:translateY(-50%);font-style:normal;font-size:11px;color:var(--mute)}
.pick{display:flex;align-items:center;gap:10px;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-weight:600;padding:10px 12px;margin-bottom:12px;text-align:left}.pick b{flex:1}.pick span{color:var(--mute)}
.cb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;flex:none}
#ov{position:fixed;inset:0;z-index:30;background:rgba(3,5,6,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#ov[hidden]{display:none}
.sheet{width:100%;max-width:480px;max-height:100%;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.sheet h2{font-size:20px;margin:0 0 6px}.sheet h3{margin:16px 0 4px;color:var(--mute)}.sheet p{margin:0 0 6px;font-size:14px}
.x{background:none;border:0;color:var(--mute);font-size:18px;padding:4px 8px}
.list{display:grid;gap:6px}.li{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--ink);font-weight:400;padding:10px}.li b{display:block;font-size:14px}.li small{display:block;font-size:12px;color:var(--mute)}.li>span:not(.cb){flex:1;min-width:0}.li i{font-style:normal;color:var(--g);font-weight:700}.li.on{border-color:var(--g)}
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;text-align:center;cursor:pointer}.sp p{font-size:20px;font-weight:700;line-height:1.6;margin:8px 0 0}
.cd.hid{min-height:110px;justify-content:center}.cd.hid b{font-size:34px;color:var(--mute)}
.dash{border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;margin-top:10px}
.scout{position:relative;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.scout::before{content:"";position:absolute;top:-7px;left:var(--cx);width:12px;height:12px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.hi{color:var(--yel)}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.sec h3{font-size:17px;margin:0 0 2px}.sec p{margin:0 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.opt{position:relative;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--ink);font-weight:400;padding:10px 12px}.opt b{font-size:14px}.opt small{display:block;color:var(--mute);font-size:12px}.opt em{position:absolute;right:10px;top:10px;font-style:normal;font-size:11px;color:var(--g);font-weight:700}.opt .v{float:right;font-weight:700;font-variant-numeric:tabular-nums}
.opt.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 10%,var(--card2))}
.note{grid-column:1/-1;margin:0;font-size:12px;color:var(--mute)}
.pcard{background:linear-gradient(160deg,var(--card2),var(--bg));border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.pn{font-size:26px;font-weight:700}
.kv1{display:grid;gap:8px;margin-top:12px;font-size:13px}.kv1 div{display:flex;justify-content:space-between;gap:8px;align-items:center}.kv1 span{color:var(--mute)}.kv1 b{display:flex;align-items:center;gap:6px}.kv1 .cb{width:22px;height:22px;font-size:8px}
.full{min-height:72vh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:6px}
.trn{display:grid;gap:8px;margin-top:18px;text-align:left}
.tr{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);opacity:.55;transition:opacity .3s}.tr .mo{color:var(--mute);font-size:12px;width:28px}.tr b{flex:1}.tr .ts{font-size:12px;color:var(--mute);font-weight:700}
.tr.now{opacity:1;border-color:var(--g)}.tr.done{opacity:1}.tr.done .ts{color:var(--ink);font-size:15px}
.callout{border-left:3px solid var(--g);background:var(--card2);border-radius:8px;padding:10px 14px;margin:12px 0}.callout small{display:block;font-size:10px;letter-spacing:.12em;color:var(--mute);font-weight:700}.callout b{font-size:15px}.callout p{margin:4px 0 0;font-size:13px;color:var(--mute)}
.tiles{display:grid;gap:6px;margin-bottom:6px}.tiles.n3{grid-template-columns:repeat(3,1fr)}.tiles.n4{grid-template-columns:repeat(4,1fr)}.tiles.n5{grid-template-columns:repeat(5,1fr)}
.tiles div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 2px;text-align:center;min-width:0}.tiles small{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tiles b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.tiles.n4 b{font-size:15px}.tiles.n5 b{font-size:15px}.tiles i{display:block;font-style:normal;font-size:11px;font-variant-numeric:tabular-nums}
.pop1{animation:pop1 .3s ease-out}@keyframes pop1{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
details.det{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 4px}details.det summary{cursor:pointer;font-size:13px;color:var(--mute)}details.det .kv{margin-top:10px}
.ovrc{display:flex;justify-content:space-between;align-items:center;background:color-mix(in srgb,var(--g) 10%,var(--card));border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0 6px}.ovrc span{font-size:12px;color:var(--mute)}.ovrc b{font-size:20px;font-variant-numeric:tabular-nums}.ovrc i{font-style:normal;display:inline-block}
.trow{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:6px;font-size:14px}

'90분당 패스':Math.round((22+pas*.55)*(['CB','DM','CM','GK'].includes(s.pos)?1.3:1)),'패스 성공률':cl(Math.round(62+pas*.3+R(-3,3)),60,95)+'%','90분당 드리블':f1(dd*dr/60*rn()),'드리블 성공률':cl(Math.round(40+dr*.4+R(-4,4)),35,80)+'%','90분당 태클':f1(df*tk/60*rn()),'90분당 인터셉트':f1(df*.9*tk/60*rn()),'90분당 슈팅 블록':f1(df*.35*rn()),'클린시트':cs,'선방률':cl(Math.round(66+gap/1.5+R(-4,4)),52,86)+'%','90분당 실점':f1(cl(1.3-gap/30+rf(0,.4),.5,2.4))};

function ivSet(){tr.on=true;tr.n=0;document.getElementById('cn').textContent='0 / '+tr.tg;const is=document.getElementById('is');is.textContent=`${tr.set+1}세트 — 연타!`;is.style.color='var(--g)';
later(()=>{tr.on=false;if(tr.n>=tr.tg)tr.ok++;tr.set++;if(tr.set>=2)return spNext(tr.ok);is.textContent=`휴식… (1세트 ${tr.ok?'성공':'실패'})`;is.style.color='var(--mute)';later(ivSet,1000)},2000)}
function memory(){const n=[2,3,3,4,5][tr.r];tr.seq=Array.from({length:n},()=>R(0,7));tr.inp=[];tr.ready=false;
spRender(spCard(`<p class="mute" id="mm" style="text-align:center;margin:10px 0 0">순서를 기억하세요 (${n}칸)</p><div class="mg">${Array.from({length:8},(_,i)=>`<b id="c${i}" onclick="spCell(${i})">${i+1}</b>`).join('')}</div>`));
let i=0;const seq=tr.seq,step=()=>{for(let j=0;j<8;j++)document.getElementById('c'+j).classList.remove('on');
if(i<n){const e=document.getElementById('c'+seq[i]);e.classList.add('on');i++;later(()=>{e.classList.remove('on');later(step,250)},600)}else{tr.ready=true;document.getElementById('mm').textContent='같은 순서로 눌러 보세요! (숫자키 1~8)'}};later(step,500);
kh=e=>{const v=+e.key;if(v>=1&&v<=8)spCell(v-1)}}
function spCell(i){if(!tr||!tr.ready||tr.lock)return;tr.inp.push(i);const e=document.getElementById('c'+i);e.classList.add('hit');later(()=>e.classList.remove('hit'),150);
if(tr.inp.length>=tr.seq.length){tr.ready=false;const c=tr.inp.filter((v,j)=>v===tr.seq[j]).length,n=tr.seq.length;spNext(c===n?2:c>=n/2?1:0)}}
const RONDO=[[5,1,'술래'],[5,2,'술래'],[5,3,'술래'],[4,1,'수비'],[4,2,'수비']];
function rondo(){tr.att=0;tr.ok=0;rondoAtt()}
function rondoAtt(){const[n,dn,who]=RONDO[tr.r],tl=[2400,2100,1900,1800,1500][tr.r],blk=new Set();while(blk.size<dn)blk.add(R(1,n));tr.blk=[...blk];tr.lock=false;tr.n=n;
const tot=n+1,pos=Array.from({length:tot},(_,j)=>{const a=Math.PI/2+j*2*Math.PI/tot;return[50+40*Math.cos(a),50+40*Math.sin(a)]});
let h=`<b class="me" style="left:${pos[0][0]}%;top:${pos[0][1]}%">나 ⚽</b>`;
for(let j=1;j<=n;j++){h+=`<button class="rp${blk.has(j)?' mk':''}" style="left:${pos[j][0]}%;top:${pos[j][1]}%" onclick="rdPick(${j})">${j}</button>`;if(blk.has(j))h+=`<i class="df" style="left:${(pos[0][0]+pos[j][0]*1.4)/2.4}%;top:${(pos[0][1]+pos[j][1]*1.4)/2.4}%">${who==='술래'?'술래':'DF'}</i>`}
spRender(spCard(`<p class="mute" style="text-align:center;margin:10px 0 0">팀원 ${n}명 · ${who} ${dn}명 · 시도 ${tr.att+1}/2 · 성공 ${tr.ok}</p><div class="rdb">${h}</div><div class="bar"><i id="rt" style="width:100%;background:var(--cy)"></i></div>`));
const t0=performance.now(),rt=document.getElementById('rt');const f=t=>{const p=(t-t0)/tl;rt.style.width=Math.max(0,100-p*100)+'%';if(p>=1)return rdRes(false,'시간 초과');raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f);
kh=e=>{const v=+e.key;if(v>=1&&v<=n)rdPick(v)}}
function rdPick(j){if(tr.lock)return;rdRes(!tr.blk.includes(j),tr.blk.includes(j)?'패스 차단!':'')}
function rdRes(ok,why){tr.lock=true;kh=null;cancelAnimationFrame(raf);if(ok)tr.ok++;tr.att++;const fb=document.getElementById('fb');fb.textContent=ok?'패스 성공!':'볼을 잃었습니다 · '+why;fb.style.color=`var(--${ok?'g':'red'})`;
later(()=>{if(tr.att>=2){tr.lock=false;spNext(tr.ok)}else rondoAtt()},600)}
const ARW=['←','↓','↑','→'];
function rhythm(){const r=tr.r,cnt=r>=3?5:4,travel=1600-r*170,gp=650-r*60;tr.notes=Array.from({length:cnt},(_,j)=>({l:R(0,3),t:700+j*gp}));tr.hits=0;tr.cnt=cnt;tr.travel=travel;
spRender(spCard(`<div class="rh" id="rh"><i class="ln"></i><i class="ln"></i><i class="ln"></i><i class="ln"></i><i class="hl"></i>${tr.notes.map((q,j)=>`<i class="nt l${q.l}" id="n${j}">${ARW[q.l]}</i>`).join('')}</div><div class="arw">${ARW.map((a,l)=>`<button class="alt" onpointerdown="rhHit(${l})">${a}</button>`).join('')}</div>`));
tr.t0=performance.now();const f=n=>{const t=n-tr.t0;let alive=false;tr.notes.forEach((q,j)=>{const y=(t-q.t)/travel,e=document.getElementById('n'+j);
if(!q.h&&y<1.3)alive=true;if(q.h||y<0||y>1.3){e.style.display='none';return}e.style.display='block';e.style.top=(y*85)+'%';if(y>1.15&&!q.miss){q.miss=1;e.classList.add('miss')}});
if(!alive)return spNext(tr.hits>=tr.cnt?2:tr.hits>=Math.ceil(tr.cnt/2)?1:0);raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f);
kh=e=>{const l={ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3}[e.code];if(l==null)return;e.preventDefault();rhHit(l)}}
function rhHit(l){if(tr.lock)return;const t=performance.now()-tr.t0;let best=null,bd=.16;tr.notes.forEach(q=>{if(q.h||q.miss||q.l!==l)return;const dd=Math.abs((t-q.t)/tr.travel-1);if(dd<bd){bd=dd;best=q}});
const fb=document.getElementById('fb');if(best){best.h=1;tr.hits++;fb.textContent=`HIT ${tr.hits}/${tr.cnt}`;fb.style.color='var(--g)'}else{fb.textContent='MISS';fb.style.color='var(--red)'}}
function tug(){tr.v=50;tr.on=false;tr.pull=[10,12,14,16,18][tr.r];
spRender(spCard(`<div class="tg"><i id="tgv"></i></div><div class="top mute"><span>밀림</span><span>밀어내기 성공</span></div><button class="w mt" id="mb" onclick="tgHit()">시작</button>`));kh=spaceKey(tgHit)}
function tgHit(){if(tr.lock)return;if(!tr.on){tr.on=true;document.getElementById('mb').textContent='밀어붙여!';const t0=performance.now(),el=document.getElementById('tgv');let last=t0;
const f=n=>{tr.v-=tr.pull*(n-last)/1000;last=n;el.style.width=cl(tr.v,0,100)+'%';if(tr.v>=100)return spNext(2);if(tr.v<=0||n-t0>5000)return spNext(tr.v>=60?1:0);raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f);return}tr.v=Math.min(100,tr.v+4.5)}
function reaction(){tr.att=0;tr.ok=0;rcAtt()}
function rcAtt(){const win=[1000,850,720,600,500][tr.r];tr.tgt=-1;tr.lock=true;
spRender(spCard(`<p class="mute" style="text-align:center;margin:10px 0 0">시도 ${tr.att+1}/2 · 막아낸 슛 ${tr.ok}</p><div class="mg">${Array.from({length:8},(_,i)=>`<b id="c${i}" onclick="rcPick(${i})">${i+1}</b>`).join('')}</div>`));
later(()=>{tr.tgt=R(0,7);tr.lock=false;const e=document.getElementById('c'+tr.tgt);e.classList.add('on');e.textContent='⚽';later(()=>{if(!tr.lock)rcRes(false)},win)},R(600,1500));
kh=e=>{const v=+e.key;if(v>=1&&v<=8)rcPick(v-1)}}
function rcPick(i){if(tr.lock||tr.tgt<0)return;rcRes(i===tr.tgt)}
function rcRes(ok){tr.lock=true;kh=null;if(ok)tr.ok++;tr.att++;const fb=document.getElementById('fb');fb.textContent=ok?'선방!':'실점';fb.style.color=`var(--${ok?'g':'red'})`;
later(()=>{if(tr.att>=2){tr.lock=false;spNext(tr.ok)}else rcAtt()},600)}
function spEnd(){if(!tr)return;stop();const t=spSum(),cur=s.st[tr.k],m=cur<12?1:cur<16?.75:cur<20?.5:.3,gain=r1(t*.1*m);bump(tr.k,gain);log(`특별훈련(${GN[tr.g][0]}) ${t}/10점 · ${tr.k} +${f1(gain)}`,'특훈','v');
modal(`<div><div class="top" style="align-items:center"><h2 style="margin:0">훈련 결과</h2><span class="mute">${GN[tr.g][0]}</span></div>
<div class="rchips">${tr.pts.map((x,i)=>`<span>${i+1}회 ${x}점</span>`).join('')}</div>
<div class="resg"><span>${tr.k}</span><div><b>+${f1(gain)}</b><small>${t}점 × 0.1${m<1?` × ${m}`:''}</small></div></div>
<div class="top" style="margin:4px 0 14px"><span class="mute">현재 ${tr.k}</span><b>${f1(s.st[tr.k])}</b></div><button class="w" onclick="closeModal();prep()">시즌 준비로 →</button></div>`);tr=null}
// ── 은퇴 ──
function retireAsk(){const back=s.ph;render(`<div class="card res"><div class="big" style="color:var(--red)">현역 은퇴</div><p>${s.age}세, ${cn()}에서 선수 생활을 마칩니다. 은퇴하면 되돌릴 수 없습니다.</p><div class="btns two"><button class="rdf" onclick="retire()">은퇴한다</button><button class="alt" onclick="RES['${back}']()">계속 뛴다</button></div></div>`+sheet())}
function retire(){const tally={};s.aw.forEach(a=>tally[a]=(tally[a]||0)+1);const ac=Object.entries(tally).map(([k,v])=>v>1?`${k} ×${v}`:k),o=ovr(s);
const sc=s.goals*2+s.ast+s.caps*2+s.aw.filter(isTeam).length*15+s.wc*20+s.aw.filter(a=>!isTeam(a)).length*12+s.tier*25+s.fame,t=sc>600?'전설':sc>380?'월드클래스':sc>220?'리그의 스타':sc>100?'믿음직한 프로':'기억 속의 선수';
const lgn=s.ci!=null?getC().n:'',one=new Set(s.hist).size===1&&s.seasons>=10,ret=lgn&&(one||s.aw.length>=10||(o>=85&&s.seasons>=8));
const sum=`#${s.num} ${s.name} (${P[s.pos].n}/${s.style}) 은퇴 — ${s.age}세, 최종 소속 ${lgn||'-'}\n${s.seasons}시즌 ${s.apps}경기 ${s.goals}골 ${s.ast}도움 · A매치 ${s.caps} · 월드컵 ${s.wc}회\n수상·우승: ${ac.join(', ')||'없음'}\n${one?'🏅 원클럽맨\n':''}${ret?`🏷 ${lgn}가 등번호 ${s.num}번을 영구결번으로 지정했습니다.\n`:''}칭호: ${t}\n#이번생은축구다`;
window._sum=sum;s.done=true;log(`${s.age}세에 현역에서 은퇴했습니다. 칭호: ${t}`,'은퇴','r');
try{const hl=hall();hl.unshift({id:s.id,v:3,name:s.name,num:s.num,foot:s.foot,pos:s.pos,style:s.style,age:s.age,apps:s.apps,goals:s.goals,ast:s.ast,caps:s.caps,wc:s.wc,aw:s.aw,lg:lgn,ovr:o,title:t});localStorage.setItem(HALL,JSON.stringify(hl.slice(0,50)));localStorage.removeItem(SAVE)}catch(e){}
render(`<div class="card res pop"><div class="mute">커리어 종료</div><div class="big" style="color:var(--yel)">${t}</div><p>${s.name}, ${s.age}세에 스파이크를 벗습니다.</p>${one?'<p style="color:var(--cy)">🏅 원클럽맨</p>':''}${ret?`<p class="up">등번호 ${s.num}번 영구결번</p>`:''}</div>`+sheet()+`<div class="card"><h2 class="k">커리어 요약</h2><p id="sumt" style="white-space:pre-line;margin:0 0 12px;font-size:14px">${sum}</p><div class="btns two"><button onclick="cp()" id="cb">결과 복사</button><button class="alt" onclick="home()">새 인생 시작</button></div><p class="mute" style="margin:8px 0 0">시즌 기록과 업적은 위쪽 탭에서 계속 볼 수 있습니다.</p></div>`)}
function cp(){const b=document.getElementById('cb'),fail=()=>{b.textContent='텍스트를 직접 복사하세요';const r=document.createRange();r.selectNodeContents(document.getElementById('sumt'));const sl=getSelection();sl.removeAllRanges();sl.addRange(r)};
try{navigator.clipboard.writeText(window._sum).then(()=>b.textContent='복사됨',fail)}catch(e){fail()}}
window._dbg={get s(){return s},get tr(){return tr},spNext:p=>spNext(p)};
home();
</script>
